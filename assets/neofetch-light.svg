<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" font-family="ConsolasFallback,Consolas,monospace" width="1094px" height="551px" font-size="16px">
<style>
@font-face { src: local('Consolas'), local('Consolas Bold'); font-family: 'ConsolasFallback'; font-display: swap; -webkit-size-adjust: 109%; size-adjust: 109%; }
.key {fill: #6D28D9;} .value {fill: #0F766E;} .add {fill: #15803D;} .del {fill: #BE123C;} .cc {fill: #C9C4E6;} .text {fill: #1F1D2E;}
.say {fill: #0F766E;}
text, tspan {white-space: pre;}

.head { animation: nod 4s ease-in-out infinite; }
.bubble { opacity: 0; transform-box: fill-box; transform-origin: 30% 100%;
          animation: pop 4s ease-out infinite; }
.p0 { animation: hop 1.2s ease-in-out infinite; }
.p1 { animation: hop 1.2s ease-in-out infinite; animation-delay: -0.6s; }
.solo { transform-box: fill-box; transform-origin: 50% 100%;
        animation: prance 0.96s infinite; }
/* Nhảy chân sáo: bật lên, đáp xuống nghiêng hẳn một bên (nén người lại), rồi đổi bên */
@keyframes prance {
  0%   { transform: translate(0, 0)      rotate(-9deg) scale(1.05, 0.93); animation-timing-function: ease-out; }
  22%  { transform: translate(-5px,-16px) rotate(-3deg) scale(0.98, 1.04); animation-timing-function: ease-in; }
  50%  { transform: translate(0, 0)      rotate(9deg)  scale(1.05, 0.93); animation-timing-function: ease-out; }
  72%  { transform: translate(5px,-16px)  rotate(3deg)  scale(0.98, 1.04); animation-timing-function: ease-in; }
  100% { transform: translate(0, 0)      rotate(-9deg) scale(1.05, 0.93); }
}
/* Tay vung xen kẽ quanh vai, cùng nhịp với bước nhảy */
.armL, .armR { transform-box: view-box; }
.armL { animation: armL 0.96s ease-in-out infinite; }
.armR { animation: armR 0.96s ease-in-out infinite; }
@keyframes armL {
  0%, 100% { transform: rotate(-24deg); }
  50%      { transform: rotate(10deg); }
}
@keyframes armR {
  0%, 100% { transform: rotate(-10deg); }
  50%      { transform: rotate(24deg); }
}
@keyframes hop {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes nod {
  0%, 8%, 24%, 40%, 100% { transform: translateY(0); }
  16%, 32% { transform: translateY(7px); }
}
@keyframes pop {
  0%, 38% { opacity: 0; transform: scale(0.6); }
  44% { opacity: 1; transform: scale(1.06); }
  48%, 90% { opacity: 1; transform: scale(1); }
  96%, 100% { opacity: 0; transform: scale(0.9); }
}
@media (prefers-reduced-motion: reduce) {
  .head, .p0, .p1, .solo, .armL, .armR { animation: none; } .bubble { animation: none; opacity: 1; }
}

</style>
