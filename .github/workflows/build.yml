name: Update neofetch card

on:
  schedule:
    - cron: "0 17 * * *"   # 00:00 giờ Việt Nam mỗi ngày
  push:
    branches: [main]
    paths: ["scripts/**", "assets/avatar.jpg", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Render SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python scripts/today.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch-dark.svg assets/neofetch-light.svg cache/
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
